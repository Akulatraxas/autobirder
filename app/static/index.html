<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autobirder</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <strong>Autobirder</strong>
    <span id="progress"></span>
    <span id="curpath"></span>
    <span class="spacer"></span>
    <label class="check"><input type="checkbox" id="hidedone"> hide done (<kbd>H</kbd>)</label>
    <button id="rescan" type="button">Rescan</button>
    <button id="helpbtn" type="button">Shortcuts <kbd>?</kbd></button>
  </header>

  <main>
    <nav id="list" aria-label="Images"></nav>

    <section id="viewer">
      <div id="imgwrap"><img id="photo" alt=""><div id="empty" hidden></div></div>
    </section>

    <aside id="panel">
      <h2>Guesses</h2>
      <div id="status" class="muted"></div>
      <ol id="candidates"></ol>
      <div id="nonebtn" class="cand none" role="button" tabindex="-1">
        <span class="key">N</span><span class="name">None of these / custom</span>
      </div>

      <h2>Will be written <small class="muted">(editable)</small></h2>
      <label>Description <span class="muted">(EXIF ImageDescription)</span>
        <input type="text" id="f-description" maxlength="2000" autocomplete="off">
      </label>
      <label>Keywords <span class="muted">(Windows tags, XMP, IPTC)</span>
        <div class="kwbox">
          <div id="chips" class="chips"><input type="text" id="f-keyword" maxlength="100" autocomplete="off" placeholder="add keyword, Enter"></div>
          <ul id="suggest" role="listbox" hidden></ul>
        </div>
      </label>
      <label>Comment <span class="muted">(EXIF UserComment)</span>
        <textarea id="f-comment" rows="3" maxlength="2000"></textarea>
      </label>

      <div id="current" class="muted"></div>

      <div class="actions">
        <button id="save" type="button" class="primary">Save &amp; next <kbd>Enter</kbd></button>
        <button id="skip" type="button">Skip <kbd>S</kbd></button>
      </div>
    </aside>
  </main>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <div id="help" hidden>
    <div class="card">
      <h2>Keyboard shortcuts</h2>
      <table id="helptable"></table>
      <p class="muted">Press <kbd>Esc</kbd> or <kbd>?</kbd> to close.</p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
